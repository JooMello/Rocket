<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎉 Feliz Aniversário Ellen!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FFE8F5 0%, #FFF0F7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body.party-mode {
            background: linear-gradient(135deg, #FF6B9D 0%, #FEC163 25%, #F093FB 50%, #4FACFE 75%, #00F2FE 100%);
            background-size: 400% 400%;
            animation: rainbow 8s ease infinite;
        }

        @keyframes rainbow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Envelope */
        #envelope {
            position: relative;
            width: 90vw;
            max-width: 400px;
            height: 280px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        #envelope:active {
            transform: scale(0.95);
        }

        #envelope.hidden {
            display: none;
        }

        .envelope-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 20px 50px rgba(255, 20, 147, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .envelope-base span {
            font-size: 2.5rem;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .envelope-flap {
            position: absolute;
            bottom: 200px;
            left: 0;
            width: 0;
            height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-top: 120px solid #C71585;
        }

        .instruction {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #FF1493;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.3);
            animation: bounce 2s ease infinite;
            white-space: nowrap;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-12px); }
        }

        /* Card de Parabéns */
        #card {
            display: none;
            width: 90vw;
            max-width: 500px;
            background: white;
            border-radius: 25px;
            padding: 40px 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: cardAppear 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        #card.show {
            display: block;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .card-title {
            font-size: 2rem;
            font-weight: 700;
            color: #FF1493;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card-name {
            font-size: 3.5rem;
            font-weight: 700;
            color: #FF1493;
            margin: 20px 0;
            text-shadow: 3px 3px 0 #FFD700;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card-cake {
            font-size: 4rem;
            margin: 20px 0;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-emojis {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            font-size: 2rem;
            flex-wrap: wrap;
        }

        .card-message {
            font-size: 1.15rem;
            color: #555;
            line-height: 1.8;
            margin: 25px 0;
        }

        .card-message strong {
            color: #FF1493;
            font-size: 1.3rem;
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF1493, #9D4EDD);
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.4);
            z-index: 1000;
            animation: spinMusic 2s linear infinite;
            display: none;
        }

        .music-btn.show {
            display: block;
        }

        @keyframes spinMusic {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Efeitos */
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #FF1493;
            border-radius: 50%;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .balloon {
            position: fixed;
            font-size: 2.5rem;
            animation: balloonFloat 10s linear infinite;
        }

        @keyframes balloonFloat {
            from {
                bottom: -50px;
                transform: translateX(0);
            }
            to {
                bottom: 110vh;
                transform: translateX(30px);
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            #envelope {
                max-width: 340px;
                height: 240px;
            }

            .envelope-base {
                height: 170px;
            }

            .envelope-base span {
                font-size: 2rem;
            }

            .envelope-flap {
                bottom: 170px;
                border-left: 170px solid transparent;
                border-right: 170px solid transparent;
                border-top: 100px solid #C71585;
            }

            .instruction {
                font-size: 1rem;
                padding: 12px 24px;
                top: -60px;
            }

            #card {
                padding: 30px 20px;
            }

            .card-title {
                font-size: 1.6rem;
            }

            .card-name {
                font-size: 2.8rem;
                text-shadow: 2px 2px 0 #FFD700;
            }

            .card-cake {
                font-size: 3rem;
            }

            .card-emojis {
                font-size: 1.6rem;
                gap: 10px;
            }

            .card-message {
                font-size: 1.05rem;
            }

            .card-message strong {
                font-size: 1.2rem;
            }

            .music-btn {
                width: 55px;
                height: 55px;
                font-size: 1.6rem;
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Envelope -->
    <div id="envelope">
        <div class="instruction">👆 Clique para abrir! 🎉</div>
        <div class="envelope-flap"></div>
        <div class="envelope-base">
            <span>🎁</span>
            <span>💕</span>
            <span>🎉</span>
        </div>
    </div>

    <!-- Card -->
    <div id="card">
        <div class="card-title">🎉 Feliz Aniversário 🎉</div>
        <div class="card-name">ELLEN</div>
        <div class="card-cake">🎂</div>
        <div class="card-emojis">
            <span>🎁</span>
            <span>🎈</span>
            <span>🎊</span>
            <span>🥳</span>
            <span>💕</span>
        </div>
        <div class="card-message">
            <strong>PARABÉNS!</strong><br><br>
            Hoje é o seu dia especial! 🎉<br>
            Hora de comemorar e ser muito feliz!<br><br>
            <strong>Te amo demais! 💕</strong>
        </div>
    </div>

    <!-- Botão Música -->
    <button class="music-btn" id="musicBtn">🎵</button>

    <script>
        let audioContext;
        let isPlaying = false;
        let scheduledNotes = [];

        // Música Parabéns
        const song = [
            {f:264,d:0.3},{f:264,d:0.3},{f:297,d:0.6},{f:264,d:0.6},{f:352,d:0.6},{f:330,d:1.2},
            {f:264,d:0.3},{f:264,d:0.3},{f:297,d:0.6},{f:264,d:0.6},{f:396,d:0.6},{f:352,d:1.2},
            {f:264,d:0.3},{f:264,d:0.3},{f:528,d:0.6},{f:440,d:0.6},{f:352,d:0.6},{f:330,d:0.6},{f:297,d:0.6},
            {f:470,d:0.3},{f:470,d:0.3},{f:440,d:0.6},{f:352,d:0.6},{f:396,d:0.6},{f:352,d:1.2}
        ];

        function playNote(freq, dur, time) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = freq;
            osc.type = 'square';
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.2, time + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.01, time + dur);
            osc.start(time);
            osc.stop(time + dur);
        }

        function playSong() {
            if (!audioContext) return;
            if (!isPlaying) return;
            
            let t = audioContext.currentTime;
            song.forEach(({f, d}) => {
                playNote(f, d, t);
                t += d;
            });
            
            setTimeout(() => {
                if (isPlaying) playSong();
            }, (t - audioContext.currentTime + 1) * 1000);
        }

        function toggleMusic() {
            if (!isPlaying) {
                isPlaying = true;
                playSong();
            } else {
                isPlaying = false;
                document.getElementById('musicBtn').textContent = '🔇';
                setTimeout(() => {
                    document.getElementById('musicBtn').textContent = '🎵';
                }, 300);
            }
        }

        function createConfetti() {
            const colors = ['#FF1493', '#FFD700', '#4FACFE', '#9D4EDD', '#FF6B9D'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + 'vw';
                    c.style.top = '-10px';
                    c.style.background = colors[Math.floor(Math.random() * colors.length)];
                    c.style.animation = `confettiFall ${2 + Math.random() * 2}s linear forwards`;
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 4000);
                }, i * 30);
            }
        }

        function createBalloon() {
            const b = document.createElement('div');
            b.className = 'balloon';
            b.textContent = '🎈';
            b.style.left = Math.random() * 90 + 'vw';
            b.style.bottom = '-50px';
            b.style.animationDuration = (8 + Math.random() * 4) + 's';
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 12000);
        }

        // Abrir envelope
        document.getElementById('envelope').addEventListener('click', function() {
            // Iniciar áudio
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // Garantir que o contexto está rodando
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            // Esconder envelope
            this.classList.add('hidden');
            
            // Mostrar card
            document.getElementById('card').classList.add('show');
            document.getElementById('musicBtn').classList.add('show');
            
            // Mudar fundo
            document.body.classList.add('party-mode');
            
            // Iniciar música
            setTimeout(() => {
                isPlaying = true;
                playSong();
            }, 500);
            
            // Confetes
            setTimeout(createConfetti, 300);
            
            // Balões contínuos
            setInterval(createBalloon, 2000);
            
            // Confetes contínuos
            setInterval(() => {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-10px';
                c.style.background = ['#FF1493', '#FFD700', '#4FACFE'][Math.floor(Math.random() * 3)];
                c.style.animation = `confettiFall ${2 + Math.random() * 2}s linear forwards`;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4000);
            }, 400);
        });

        // Botão música
        document.getElementById('musicBtn').addEventListener('click', toggleMusic);
    </script>
</body>
</html>
