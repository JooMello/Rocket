<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 FELIZ ANIVERSÁRIO ELLEN! 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFE8F5 0%, #FFF5F7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Estado: Antes de abrir */
        body.unopened {
            background: linear-gradient(135deg, #FFE8F5 0%, #FFF5F7 100%);
        }

        /* Estado: Depois de abrir */
        body.opened {
            background: linear-gradient(135deg, #FF6B9D 0%, #FEC163 25%, #F093FB 50%, #4FACFE 75%, #00F2FE 100%);
            background-size: 400% 400%;
            animation: rainbow-bg 8s ease infinite;
        }

        @keyframes rainbow-bg {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Envelope */
        .envelope-wrapper {
            position: relative;
            width: 90%;
            max-width: 400px;
            height: 280px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        body.opened .envelope-wrapper {
            display: none;
        }

        .envelope-wrapper:hover {
            transform: scale(1.05);
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .envelope-back {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 20px 60px rgba(255, 20, 147, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .envelope-decoration {
            font-size: 2rem;
            animation: gentle-float 2s ease-in-out infinite;
        }

        @keyframes gentle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .envelope-flap {
            position: absolute;
            bottom: 70%;
            left: 0;
            width: 0;
            height: 0;
            border-left: 200px solid transparent;
            border-right: 200px solid transparent;
            border-top: 140px solid #C71585;
            cursor: pointer;
        }

        .instruction {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #FF1493;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.3);
            animation: bounce-instruction 2s ease-in-out infinite;
            white-space: nowrap;
        }

        @keyframes bounce-instruction {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Container principal (aparece depois de abrir) */
        .container {
            display: none;
            max-width: 90%;
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            border: 5px solid #FFD700;
        }

        body.opened .container {
            display: block;
            animation: bounce-in 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounce-in {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FF1493, #FF6B9D, #FFD700, #4FACFE, #9D4EDD);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow-text 3s ease infinite, shake 0.5s ease infinite;
            margin-bottom: 15px;
        }

        @keyframes rainbow-text {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }

        .name {
            font-size: 3.5rem;
            font-weight: 700;
            color: #FF1493;
            text-shadow: 
                2px 2px 0 #FFD700,
                4px 4px 0 #4FACFE,
                6px 6px 0 #9D4EDD;
            animation: jump 0.8s ease-in-out infinite;
            margin: 20px 0;
        }

        @keyframes jump {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        .emoji-circle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
            font-size: 2rem;
            flex-wrap: wrap;
        }

        .emoji {
            display: inline-block;
            animation: spin-emoji 2s linear infinite;
        }

        .emoji:nth-child(2) { animation-delay: 0.2s; }
        .emoji:nth-child(3) { animation-delay: 0.4s; }
        .emoji:nth-child(4) { animation-delay: 0.6s; }
        .emoji:nth-child(5) { animation-delay: 0.8s; }

        @keyframes spin-emoji {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .message {
            font-size: 1.2rem;
            color: #333;
            line-height: 1.6;
            margin: 25px 0;
            font-weight: 500;
        }

        .message .highlight {
            color: #FF1493;
            font-weight: 700;
            font-size: 1.4rem;
        }

        .cake {
            font-size: 4rem;
            display: inline-block;
            animation: cake-bounce 1s ease-in-out infinite;
            margin: 15px 0;
        }

        @keyframes cake-bounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            25% { transform: translateY(-15px) rotate(0deg); }
            50% { transform: translateY(0) rotate(5deg); }
            75% { transform: translateY(-15px) rotate(0deg); }
        }

        .footer {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #FF1493;
            animation: rainbow-text 3s ease infinite;
            background: linear-gradient(45deg, #FF1493, #FFD700, #4FACFE, #9D4EDD);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Controle de música */
        .music-control {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #FF1493, #9D4EDD);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.5);
            z-index: 1000;
            animation: spin-music 2s linear infinite;
        }

        body.opened .music-control {
            display: block;
        }

        @keyframes spin-music {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Animações de fundo */
        .balloon {
            display: none;
            position: absolute;
            font-size: 2.5rem;
            animation: float-up 8s ease-in-out infinite;
        }

        body.opened .balloon {
            display: block;
        }

        @keyframes float-up {
            0% {
                bottom: -100px;
                transform: translateX(0) rotate(0deg);
            }
            50% {
                transform: translateX(20px) rotate(10deg);
            }
            100% {
                bottom: 110%;
                transform: translateX(-20px) rotate(-10deg);
            }
        }

        .star {
            display: none;
            position: absolute;
            font-size: 1.8rem;
            animation: twinkle 1s ease-in-out infinite;
        }

        body.opened .star {
            display: block;
        }

        @keyframes twinkle {
            0%, 100% { 
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            50% { 
                opacity: 0.3;
                transform: scale(1.5) rotate(180deg);
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
        }

        @keyframes confetti-fall {
            to {
                transform: translate(var(--tx), var(--ty)) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .envelope-wrapper {
                max-width: 320px;
                height: 240px;
            }
            
            .envelope-flap {
                border-left: 160px solid transparent;
                border-right: 160px solid transparent;
                border-top: 110px solid #C71585;
            }
            
            .instruction {
                font-size: 0.95rem;
                padding: 12px 24px;
                top: -70px;
            }
            
            .container {
                padding: 30px 20px;
                border-radius: 25px;
            }
            
            .title {
                font-size: 2rem;
            }
            
            .name {
                font-size: 2.8rem;
                text-shadow: 
                    2px 2px 0 #FFD700,
                    3px 3px 0 #4FACFE,
                    4px 4px 0 #9D4EDD;
            }
            
            .message {
                font-size: 1.1rem;
            }
            
            .message .highlight {
                font-size: 1.3rem;
            }
            
            .emoji-circle {
                font-size: 1.8rem;
                gap: 8px;
            }
            
            .cake {
                font-size: 3rem;
            }
            
            .music-control {
                width: 55px;
                height: 55px;
                font-size: 1.6rem;
                bottom: 15px;
                right: 15px;
            }
            
            .balloon {
                font-size: 2rem;
            }
            
            .star {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body class="unopened">
    <!-- Envelope (antes de abrir) -->
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="instruction">👆 Clique para abrir! 🎉</div>
        <div class="envelope">
            <div class="envelope-back">
                <span class="envelope-decoration" style="animation-delay: 0s;">🎁</span>
                <span class="envelope-decoration" style="animation-delay: 0.2s;">🎈</span>
                <span class="envelope-decoration" style="animation-delay: 0.4s;">💕</span>
                <span class="envelope-decoration" style="animation-delay: 0.6s;">🎉</span>
            </div>
            <div class="envelope-flap"></div>
        </div>
    </div>

    <!-- Balões (aparecem depois de abrir) -->
    <div class="balloon" style="left: 5%; animation-delay: 0s;">🎈</div>
    <div class="balloon" style="left: 20%; animation-delay: 1.5s;">🎈</div>
    <div class="balloon" style="left: 40%; animation-delay: 3s;">🎈</div>
    <div class="balloon" style="left: 60%; animation-delay: 1s;">🎈</div>
    <div class="balloon" style="left: 80%; animation-delay: 2.5s;">🎈</div>
    <div class="balloon" style="left: 95%; animation-delay: 4s;">🎈</div>

    <!-- Estrelas (aparecem depois de abrir) -->
    <div class="star" style="left: 5%; top: 10%; animation-delay: 0s;">⭐</div>
    <div class="star" style="right: 10%; top: 20%; animation-delay: 0.3s;">✨</div>
    <div class="star" style="left: 15%; bottom: 15%; animation-delay: 0.6s;">💫</div>
    <div class="star" style="right: 20%; bottom: 25%; animation-delay: 0.9s;">🌟</div>
    <div class="star" style="left: 50%; top: 5%; animation-delay: 0.2s;">⭐</div>
    <div class="star" style="right: 5%; top: 60%; animation-delay: 0.7s;">✨</div>
    <div class="star" style="left: 70%; bottom: 10%; animation-delay: 0.8s;">💫</div>
    <div class="star" style="right: 40%; bottom: 40%; animation-delay: 0.1s;">🌟</div>

    <!-- Container principal (aparece depois de abrir) -->
    <div class="container">
        <div class="title">🎉 FELIZ ANIVERSÁRIO 🎉</div>
        
        <div class="name">ELLEN</div>
        
        <div class="cake">🎂</div>
        
        <div class="emoji-circle">
            <span class="emoji">🎁</span>
            <span class="emoji">🎊</span>
            <span class="emoji">🎈</span>
            <span class="emoji">🎉</span>
            <span class="emoji">🥳</span>
        </div>
        
        <div class="message">
            <span class="highlight">PARABÉNS!</span><br><br>
            Hoje é o seu dia especial! 🎉<br>
            Hora de comemorar, sorrir<br>
            e ser muito feliz!<br><br>
            <span class="highlight">Te amo demais! 💕</span>
        </div>
        
        <div class="footer">
            ✨ Aproveite muito o seu dia! ✨
        </div>
    </div>

    <!-- Botão de música -->
    <button class="music-control" id="musicControl" onclick="toggleMusic()">
        🎵
    </button>

    <script>
        // Música retrô 8-bit
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let isPlaying = false;

        const happyBirthdaySong = [
            { note: 264, duration: 0.3 }, { note: 264, duration: 0.3 },
            { note: 297, duration: 0.6 }, { note: 264, duration: 0.6 },
            { note: 352, duration: 0.6 }, { note: 330, duration: 1.2 },
            { note: 264, duration: 0.3 }, { note: 264, duration: 0.3 },
            { note: 297, duration: 0.6 }, { note: 264, duration: 0.6 },
            { note: 396, duration: 0.6 }, { note: 352, duration: 1.2 },
            { note: 264, duration: 0.3 }, { note: 264, duration: 0.3 },
            { note: 528, duration: 0.6 }, { note: 440, duration: 0.6 },
            { note: 352, duration: 0.6 }, { note: 330, duration: 0.6 },
            { note: 297, duration: 0.6 }, { note: 470, duration: 0.3 },
            { note: 470, duration: 0.3 }, { note: 440, duration: 0.6 },
            { note: 352, duration: 0.6 }, { note: 396, duration: 0.6 },
            { note: 352, duration: 1.2 },
        ];

        function playRetroNote(frequency, duration, startTime) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = frequency;
            osc.type = 'square';
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.15, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            osc.start(startTime);
            osc.stop(startTime + duration);

            const harm = audioContext.createOscillator();
            const harmGain = audioContext.createGain();
            harm.connect(harmGain);
            harmGain.connect(audioContext.destination);
            harm.frequency.value = frequency / 2;
            harm.type = 'square';
            harmGain.gain.setValueAtTime(0, startTime);
            harmGain.gain.linearRampToValueAtTime(0.08, startTime + 0.01);
            harmGain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            harm.start(startTime);
            harm.stop(startTime + duration);
        }

        function playHappyBirthday() {
            if (!isPlaying) return;
            let currentTime = audioContext.currentTime;
            happyBirthdaySong.forEach(({ note, duration }) => {
                playRetroNote(note, duration, currentTime);
                currentTime += duration;
            });
            setTimeout(() => {
                if (isPlaying) playHappyBirthday();
            }, (currentTime - audioContext.currentTime + 1) * 1000);
        }

        function toggleMusic() {
            const button = document.getElementById('musicControl');
            if (!isPlaying) {
                isPlaying = true;
                playHappyBirthday();
            } else {
                isPlaying = false;
                button.textContent = '🔇';
                setTimeout(() => {
                    if (!isPlaying) button.textContent = '🎵';
                }, 300);
            }
        }

        // Abrir envelope
        document.getElementById('envelopeWrapper').addEventListener('click', function() {
            document.body.classList.remove('unopened');
            document.body.classList.add('opened');
            
            // Iniciar música
            setTimeout(() => {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                isPlaying = true;
                playHappyBirthday();
            }, 500);

            // Confetes contínuos
            setTimeout(() => {
                setInterval(() => {
                    const colors = ['#FF1493', '#FFD700', '#4FACFE', '#9D4EDD'];
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-20px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.width = (Math.random() * 8 + 4) + 'px';
                    confetti.style.height = confetti.style.width;
                    const tx = (Math.random() - 0.5) * 200;
                    const ty = window.innerHeight + 100;
                    confetti.style.setProperty('--tx', tx + 'px');
                    confetti.style.setProperty('--ty', ty + 'px');
                    confetti.style.animation = `confetti-fall ${3 + Math.random() * 2}s linear forwards`;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, 300);
            }, 800);
        });
    </script>
</body>
</html>
