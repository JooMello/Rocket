<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 FELIZ ANIVERSÁRIO ELLEN! 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FF6B9D 0%, #FEC163 25%, #F093FB 50%, #4FACFE 75%, #00F2FE 100%);
            background-size: 400% 400%;
            animation: rainbow-bg 8s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes rainbow-bg {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Container */
        .container {
            max-width: 900px;
            width: 90%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 40px;
            padding: 50px 40px;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: bounce-in 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 5px solid #FFD700;
        }

        @keyframes bounce-in {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Título */
        .title {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FF1493, #FF6B9D, #FFD700, #4FACFE, #9D4EDD);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow-text 3s ease infinite, shake 0.5s ease infinite;
            margin-bottom: 20px;
        }

        @keyframes rainbow-text {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }

        /* Nome */
        .name {
            font-size: 5.5rem;
            font-weight: 700;
            color: #FF1493;
            text-shadow: 
                3px 3px 0 #FFD700,
                6px 6px 0 #4FACFE,
                9px 9px 0 #9D4EDD;
            animation: jump 0.8s ease-in-out infinite;
            margin: 30px 0;
        }

        @keyframes jump {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        /* Emojis girando */
        .emoji-circle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 40px 0;
            font-size: 3rem;
        }

        .emoji {
            display: inline-block;
            animation: spin-emoji 2s linear infinite;
        }

        .emoji:nth-child(2) { animation-delay: 0.2s; }
        .emoji:nth-child(3) { animation-delay: 0.4s; }
        .emoji:nth-child(4) { animation-delay: 0.6s; }
        .emoji:nth-child(5) { animation-delay: 0.8s; }

        @keyframes spin-emoji {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Mensagem */
        .message {
            font-size: 1.5rem;
            color: #333;
            line-height: 1.8;
            margin: 40px 0;
            font-weight: 500;
            animation: pulse-text 2s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .message .highlight {
            color: #FF1493;
            font-weight: 700;
            font-size: 1.8rem;
        }

        /* Botão de festa */
        .party-button {
            background: linear-gradient(135deg, #FF1493, #FFD700);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 30px 0;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
            transition: all 0.3s ease;
            animation: wiggle 1s ease-in-out infinite;
            font-family: 'Fredoka', sans-serif;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .party-button:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.6);
        }

        /* Balões flutuantes */
        .balloon {
            position: absolute;
            font-size: 3rem;
            animation: float-up 8s ease-in-out infinite;
        }

        @keyframes float-up {
            0% {
                bottom: -100px;
                transform: translateX(0) rotate(0deg);
            }
            50% {
                transform: translateX(20px) rotate(10deg);
            }
            100% {
                bottom: 110%;
                transform: translateX(-20px) rotate(-10deg);
            }
        }

        /* Estrelas piscando */
        .star {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 1s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { 
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            50% { 
                opacity: 0.3;
                transform: scale(1.5) rotate(180deg);
            }
        }

        /* Confetes explosivos */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
        }

        @keyframes confetti-explosion {
            to {
                transform: translate(var(--tx), var(--ty)) rotate(720deg);
                opacity: 0;
            }
        }

        /* Cake */
        .cake {
            font-size: 5rem;
            display: inline-block;
            animation: cake-bounce 1s ease-in-out infinite;
            margin: 20px 0;
        }

        @keyframes cake-bounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            25% { transform: translateY(-15px) rotate(0deg); }
            50% { transform: translateY(0) rotate(5deg); }
            75% { transform: translateY(-15px) rotate(0deg); }
        }

        /* Footer divertido */
        .footer {
            margin-top: 40px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #FF1493;
            animation: rainbow-text 3s ease infinite;
            background: linear-gradient(45deg, #FF1493, #FFD700, #4FACFE, #9D4EDD);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Controle de música */
        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #FF1493, #9D4EDD);
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.5);
            transition: all 0.3s ease;
            z-index: 1000;
            animation: pulse-music 2s ease-in-out infinite;
        }

        @keyframes pulse-music {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(255, 20, 147, 0.5);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 15px 40px rgba(255, 20, 147, 0.8);
            }
        }

        .music-control:hover {
            transform: scale(1.15) rotate(10deg);
        }

        .music-control.playing {
            animation: spin-music 2s linear infinite;
        }

        @keyframes spin-music {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Fogos de artifício */
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }

        @keyframes firework-burst {
            to {
                transform: translate(var(--fx), var(--fy));
                opacity: 0;
            }
        }

        /* Estrelas cadentes */
        .shooting-star {
            position: absolute;
            width: 3px;
            height: 80px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0), #FFD700);
            animation: shoot 2s linear infinite;
        }

        @keyframes shoot {
            from {
                transform: translateX(0) translateY(-100px) rotate(45deg);
                opacity: 1;
            }
            to {
                transform: translateX(-500px) translateY(500px) rotate(45deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
            }
            .title {
                font-size: 2.5rem;
            }
            .name {
                font-size: 3.5rem;
                text-shadow: 
                    2px 2px 0 #FFD700,
                    4px 4px 0 #4FACFE,
                    6px 6px 0 #9D4EDD;
            }
            .message {
                font-size: 1.2rem;
            }
            .message .highlight {
                font-size: 1.4rem;
            }
            .emoji-circle {
                font-size: 2rem;
            }
            .party-button {
                font-size: 1.2rem;
                padding: 15px 35px;
            }
            .music-control {
                width: 60px;
                height: 60px;
                bottom: 20px;
                right: 20px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Balões (mais balões!) -->
    <div class="balloon" style="left: 5%; animation-delay: 0s;">🎈</div>
    <div class="balloon" style="left: 15%; animation-delay: 1.5s;">🎈</div>
    <div class="balloon" style="left: 25%; animation-delay: 3s;">🎈</div>
    <div class="balloon" style="left: 35%; animation-delay: 2s;">🎈</div>
    <div class="balloon" style="left: 45%; animation-delay: 4.5s;">🎈</div>
    <div class="balloon" style="left: 55%; animation-delay: 1s;">🎈</div>
    <div class="balloon" style="left: 65%; animation-delay: 3.5s;">🎈</div>
    <div class="balloon" style="left: 75%; animation-delay: 0.5s;">🎈</div>
    <div class="balloon" style="left: 85%; animation-delay: 2.5s;">🎈</div>
    <div class="balloon" style="left: 95%; animation-delay: 4s;">🎈</div>

    <!-- Estrelas (mais estrelas!) -->
    <div class="star" style="left: 5%; top: 10%; animation-delay: 0s;">⭐</div>
    <div class="star" style="right: 10%; top: 20%; animation-delay: 0.3s;">✨</div>
    <div class="star" style="left: 15%; bottom: 15%; animation-delay: 0.6s;">💫</div>
    <div class="star" style="right: 20%; bottom: 25%; animation-delay: 0.9s;">🌟</div>
    <div class="star" style="left: 80%; top: 30%; animation-delay: 0.4s;">⭐</div>
    <div class="star" style="right: 5%; top: 70%; animation-delay: 0.7s;">✨</div>
    <div class="star" style="left: 40%; top: 5%; animation-delay: 0.2s;">⭐</div>
    <div class="star" style="right: 40%; top: 50%; animation-delay: 0.5s;">✨</div>
    <div class="star" style="left: 70%; bottom: 10%; animation-delay: 0.8s;">💫</div>
    <div class="star" style="right: 30%; bottom: 40%; animation-delay: 0.1s;">🌟</div>
    <div class="star" style="left: 25%; top: 60%; animation-delay: 0.6s;">⭐</div>
    <div class="star" style="right: 15%; top: 40%; animation-delay: 0.9s;">✨</div>

    <!-- Container -->
    <div class="container">
        <div class="title">🎉 FELIZ ANIVERSÁRIO 🎉</div>
        
        <div class="name">ELLEN</div>
        
        <div class="cake">🎂</div>
        
        <div class="emoji-circle">
            <span class="emoji">🎁</span>
            <span class="emoji">🎊</span>
            <span class="emoji">🎈</span>
            <span class="emoji">🎉</span>
            <span class="emoji">🥳</span>
        </div>
        
        <div class="message">
            <span class="highlight">PARABÉNS!</span><br><br>
            Hoje é o seu dia especial! 🎉<br>
            Hora de comemorar, sorrir e ser feliz!<br><br>
            Que venham muitas aventuras,<br>
            risadas e momentos incríveis! 🎈<br><br>
            <span class="highlight">Te amo demais! 💕</span>
        </div>
        
        <button class="party-button" onclick="celebrate()">
            🎊 EXPLODIR DE ALEGRIA! 🎊
        </button>
        
        <div class="footer">
            ✨ Aproveite muito o seu dia! ✨
        </div>
    </div>

    <!-- Botão de controle de música -->
    <button class="music-control" id="musicControl" onclick="toggleMusic()">
        🎵
    </button>

    <!-- Áudio -->
    <audio id="backgroundMusic" loop>
        <!-- Música de aniversário -->
    </audio>

    <script>
        // Criar música de aniversário RETRÔ com Web Audio API
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let isPlaying = true; // Começa tocando automaticamente
        let oscillators = [];

        // Notas da música "Parabéns" completa - estilo retrô 8-bit
        const happyBirthdaySong = [
            // Parabéns pra você
            { note: 264, duration: 0.3 }, // C
            { note: 264, duration: 0.3 }, // C
            { note: 297, duration: 0.6 }, // D
            { note: 264, duration: 0.6 }, // C
            { note: 352, duration: 0.6 }, // F
            { note: 330, duration: 1.2 }, // E
            
            // Parabéns pra você
            { note: 264, duration: 0.3 }, // C
            { note: 264, duration: 0.3 }, // C
            { note: 297, duration: 0.6 }, // D
            { note: 264, duration: 0.6 }, // C
            { note: 396, duration: 0.6 }, // G
            { note: 352, duration: 1.2 }, // F
            
            // Parabéns querida Ellen
            { note: 264, duration: 0.3 }, // C
            { note: 264, duration: 0.3 }, // C
            { note: 528, duration: 0.6 }, // C (oitava acima)
            { note: 440, duration: 0.6 }, // A
            { note: 352, duration: 0.6 }, // F
            { note: 330, duration: 0.6 }, // E
            { note: 297, duration: 0.6 }, // D
            
            // Parabéns pra você
            { note: 470, duration: 0.3 }, // Bb
            { note: 470, duration: 0.3 }, // Bb
            { note: 440, duration: 0.6 }, // A
            { note: 352, duration: 0.6 }, // F
            { note: 396, duration: 0.6 }, // G
            { note: 352, duration: 1.2 }, // F
        ];

        // Criar som retrô 8-bit
        function playRetroNote(frequency, duration, startTime) {
            // Melodia principal (onda quadrada - som retrô)
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'square'; // Som retrô/8-bit
            
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.15, startTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
            
            // Harmonia (oitava abaixo) para som mais cheio
            const harmonyOsc = audioContext.createOscillator();
            const harmonyGain = audioContext.createGain();
            
            harmonyOsc.connect(harmonyGain);
            harmonyGain.connect(audioContext.destination);
            
            harmonyOsc.frequency.value = frequency / 2;
            harmonyOsc.type = 'square';
            
            harmonyGain.gain.setValueAtTime(0, startTime);
            harmonyGain.gain.linearRampToValueAtTime(0.08, startTime + 0.01);
            harmonyGain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            
            harmonyOsc.start(startTime);
            harmonyOsc.stop(startTime + duration);
        }

        function playHappyBirthday() {
            if (!isPlaying) return;
            
            let currentTime = audioContext.currentTime;
            
            happyBirthdaySong.forEach(({ note, duration }) => {
                playRetroNote(note, duration, currentTime);
                currentTime += duration;
            });
            
            // Repetir a música com pausa
            setTimeout(() => {
                if (isPlaying) playHappyBirthday();
            }, (currentTime - audioContext.currentTime + 1) * 1000); // +1s de pausa
        }

        function toggleMusic() {
            const button = document.getElementById('musicControl');
            
            if (!isPlaying) {
                isPlaying = true;
                button.classList.add('playing');
                button.textContent = '🎵';
                playHappyBirthday();
            } else {
                isPlaying = false;
                button.classList.remove('playing');
                button.textContent = '🔇';
            }
        }

        // Iniciar música automaticamente após interação do usuário
        document.addEventListener('click', function startMusic() {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (isPlaying) {
                playHappyBirthday();
                const button = document.getElementById('musicControl');
                button.classList.add('playing');
            }
            document.removeEventListener('click', startMusic);
        }, { once: true });

        // Criar estrelas cadentes
        function createShootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 50 + '%';
            document.body.appendChild(star);
            
            setTimeout(() => star.remove(), 2000);
        }

        setInterval(createShootingStar, 3000);

        // Criar fogos de artifício aleatórios
        function createRandomFirework() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * (window.innerHeight * 0.6);
            
            const colors = ['#FF1493', '#FFD700', '#4FACFE', '#9D4EDD', '#FF6B9D', '#00F2FE'];
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = x + 'px';
                firework.style.top = y + 'px';
                firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = 50 + Math.random() * 100;
                const fx = Math.cos(angle) * velocity;
                const fy = Math.sin(angle) * velocity;
                
                firework.style.setProperty('--fx', fx + 'px');
                firework.style.setProperty('--fy', fy + 'px');
                
                document.body.appendChild(firework);
                
                firework.style.animation = `firework-burst ${0.8 + Math.random() * 0.4}s ease-out forwards`;
                
                setTimeout(() => firework.remove(), 1200);
            }
        }

        // Fogos de artifício contínuos
        setInterval(createRandomFirework, 2000);

        function celebrate() {
            // Explosão de confetes
            const colors = ['#FF1493', '#FFD700', '#4FACFE', '#9D4EDD', '#FF6B9D', '#00F2FE'];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = centerX + 'px';
                    confetti.style.top = centerY + 'px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    
                    const angle = (Math.PI * 2 * i) / 150;
                    const velocity = 150 + Math.random() * 200;
                    const tx = Math.cos(angle) * velocity;
                    const ty = Math.sin(angle) * velocity;
                    
                    confetti.style.setProperty('--tx', tx + 'px');
                    confetti.style.setProperty('--ty', ty + 'px');
                    
                    document.body.appendChild(confetti);
                    
                    confetti.style.animation = `confetti-explosion ${1 + Math.random() * 0.5}s ease-out forwards`;
                    
                    setTimeout(() => confetti.remove(), 1500);
                }, i * 5);
            }
            
            // Vibrar o botão
            const button = document.querySelector('.party-button');
            button.style.animation = 'none';
            setTimeout(() => {
                button.style.animation = 'wiggle 0.1s ease-in-out 10';
            }, 10);
        }

        // Confetes contínuos de fundo
        setInterval(() => {
            const colors = ['#FF1493', '#FFD700', '#4FACFE', '#9D4EDD'];
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.top = '-20px';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            confetti.style.width = (Math.random() * 8 + 4) + 'px';
            confetti.style.height = confetti.style.width;
            
            const tx = (Math.random() - 0.5) * 200;
            const ty = window.innerHeight + 100;
            confetti.style.setProperty('--tx', tx + 'px');
            confetti.style.setProperty('--ty', ty + 'px');
            confetti.style.animation = `confetti-explosion ${3 + Math.random() * 2}s linear forwards`;
            
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 5000);
        }, 300);

        // Explosão inicial após 1 segundo
        setTimeout(celebrate, 1000);
    </script>
</body>
</html>
