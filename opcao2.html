<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário Ellen 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FFE8F0 0%, #FFD6E8 50%, #FFE8F0 100%);
            background-size: 200% 200%;
            animation: gradient-move 10s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradient-move {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Instrução */
        .instruction {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #FF1493;
            padding: 15px 35px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(255, 20, 147, 0.3);
            border: 3px solid #FFB6C1;
            animation: bounce-instruction 2s ease-in-out infinite;
            z-index: 100;
            font-size: 1rem;
        }

        .instruction.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        @keyframes bounce-instruction {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Container da caixa */
        .gift-container {
            position: relative;
            width: 350px;
            height: 350px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gift-container:hover:not(.opened) {
            transform: scale(1.05);
        }

        /* Caixa */
        .gift-box {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .box-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(135deg, #FF1493 0%, #FF69B4 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 20, 147, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .box-decoration {
            font-size: 2rem;
            animation: spin-decoration 4s linear infinite;
        }

        @keyframes spin-decoration {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
        }

        /* Tampa da caixa */
        .box-lid {
            position: absolute;
            top: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(135deg, #C71585 0%, #FF1493 100%);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(199, 21, 133, 0.5);
            transform-origin: bottom center;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .gift-container.opened .box-lid {
            transform: translateY(-200px) rotateX(-120deg);
            opacity: 0;
        }

        .lid-bow {
            font-size: 4rem;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        /* Laço decorativo */
        .ribbon-vertical {
            position: absolute;
            width: 30px;
            height: 100%;
            background: linear-gradient(90deg, #8B008B 0%, #C71585 100%);
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        .ribbon-horizontal {
            position: absolute;
            width: 100%;
            height: 30px;
            background: linear-gradient(180deg, #8B008B 0%, #C71585 100%);
            top: 35%;
            z-index: 5;
        }

        /* Conteúdo que aparece */
        .gift-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            background: white;
            border-radius: 25px;
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
            border: 4px solid #FFB6C1;
            max-width: 380px;
            z-index: 15;
        }

        .gift-container.opened .gift-content {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .content-title {
            font-family: 'Pacifico', cursive;
            font-size: 2.2rem;
            color: #FF1493;
            margin-bottom: 20px;
        }

        .content-sparkle {
            font-size: 3rem;
            margin: 15px 0;
            display: inline-block;
            animation: rotate-sparkle 3s linear infinite;
        }

        @keyframes rotate-sparkle {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .content-name {
            font-size: 3.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FF1493, #FF69B4, #FFB6C1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .content-decorations {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
            font-size: 1.6rem;
        }

        .content-message {
            font-size: 1.05rem;
            color: #DB7093;
            line-height: 1.9;
            margin: 25px 0;
            font-weight: 400;
        }

        .content-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
            font-size: 1.8rem;
        }

        .content-icon {
            animation: pop-in 0.5s ease backwards;
        }

        .content-icon:nth-child(1) { animation-delay: 0.1s; }
        .content-icon:nth-child(2) { animation-delay: 0.2s; }
        .content-icon:nth-child(3) { animation-delay: 0.3s; }
        .content-icon:nth-child(4) { animation-delay: 0.4s; }
        .content-icon:nth-child(5) { animation-delay: 0.5s; }
        .content-icon:nth-child(6) { animation-delay: 0.6s; }
        .content-icon:nth-child(7) { animation-delay: 0.7s; }
        .content-icon:nth-child(8) { animation-delay: 0.8s; }

        @keyframes pop-in {
            from {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Confetes */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Decorações ambiente */
        .floating-item {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            animation: float-ambient 5s ease-in-out infinite;
        }

        @keyframes float-ambient {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        @media (max-width: 768px) {
            .gift-container {
                width: 280px;
                height: 280px;
            }
            .gift-content {
                max-width: 300px;
                padding: 30px 25px;
            }
            .content-title {
                font-size: 1.8rem;
            }
            .content-name {
                font-size: 2.5rem;
            }
            .content-message {
                font-size: 0.95rem;
            }
            .instruction {
                font-size: 0.9rem;
                padding: 12px 28px;
                top: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Decorações flutuantes -->
    <div class="floating-item" style="left: 5%; top: 10%; animation-delay: 0s;">🐱</div>
    <div class="floating-item" style="right: 8%; top: 15%; animation-delay: 1s;">🌸</div>
    <div class="floating-item" style="left: 10%; bottom: 15%; animation-delay: 2s;">🎀</div>
    <div class="floating-item" style="right: 12%; bottom: 20%; animation-delay: 1.5s;">💕</div>
    <div class="floating-item" style="left: 50%; top: 5%; animation-delay: 0.5s;">🧁</div>
    <div class="floating-item" style="right: 20%; top: 50%; animation-delay: 2.5s;">🍪</div>

    <!-- Instrução -->
    <div class="instruction" id="instruction">
        🎁 Clique na caixa para abrir! ✨
    </div>

    <!-- Container da caixa -->
    <div class="gift-container" id="giftContainer">
        <!-- Laços decorativos -->
        <div class="ribbon-vertical"></div>
        <div class="ribbon-horizontal"></div>

        <!-- Caixa -->
        <div class="gift-box">
            <!-- Parte de baixo -->
            <div class="box-bottom">
                <span class="box-decoration" style="animation-delay: 0s;">🐱</span>
                <span class="box-decoration" style="animation-delay: 0.5s;">🌸</span>
                <span class="box-decoration" style="animation-delay: 1s;">💕</span>
                <span class="box-decoration" style="animation-delay: 1.5s;">🐱</span>
            </div>

            <!-- Tampa -->
            <div class="box-lid">
                <div class="lid-bow">🎀</div>
            </div>
        </div>

        <!-- Conteúdo (aparece quando abre) -->
        <div class="gift-content">
            <div class="content-title">Feliz Aniversário</div>
            <div class="content-sparkle">✨</div>
            <div class="content-name">Ellen</div>
            <div class="content-decorations">
                <span>🌸</span>
                <span>🐱</span>
                <span>💕</span>
                <span>🐱</span>
                <span>🌸</span>
            </div>
            <div class="content-message">
                Que seu dia seja repleto de amor,<br>
                sorrisos e momentos especiais!<br>
                Você merece tudo de mais lindo<br>
                nesse mundo! 🎂
            </div>
            <div class="content-icons">
                <span class="content-icon">🐱</span>
                <span class="content-icon">🌸</span>
                <span class="content-icon">🍪</span>
                <span class="content-icon">🧁</span>
                <span class="content-icon">🎀</span>
                <span class="content-icon">💕</span>
                <span class="content-icon">🌺</span>
                <span class="content-icon">✨</span>
            </div>
        </div>
    </div>

    <script>
        const giftContainer = document.getElementById('giftContainer');
        const instruction = document.getElementById('instruction');
        let isOpened = false;

        function createConfetti() {
            const colors = ['#FF1493', '#FF69B4', '#FFB6C1', '#FFC0CB', '#FFD700', '#FF6347'];
            const count = 100;

            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = '50%';
                confetti.style.top = '50%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 8 + 4) + 'px';
                confetti.style.height = confetti.style.width;
                
                const angle = (Math.PI * 2 * i) / count;
                const velocity = 200 + Math.random() * 200;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                document.body.appendChild(confetti);
                
                confetti.animate([
                    {
                        transform: 'translate(0, 0) rotate(0deg)',
                        opacity: 1
                    },
                    {
                        transform: `translate(${tx}px, ${ty}px) rotate(720deg)`,
                        opacity: 0
                    }
                ], {
                    duration: 1500 + Math.random() * 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });
                
                setTimeout(() => confetti.remove(), 2500);
            }
        }

        function createContinuousConfetti() {
            setInterval(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-20px';
                confetti.style.background = ['#FF1493', '#FF69B4', '#FFB6C1', '#FFC0CB'][Math.floor(Math.random() * 4)];
                confetti.style.width = (Math.random() * 8 + 4) + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animation = `confetti-fall ${2 + Math.random() * 2}s linear forwards`;
                
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }, 200);
        }

        giftContainer.addEventListener('click', function() {
            if (!isOpened) {
                isOpened = true;
                this.classList.add('opened');
                instruction.classList.add('hidden');
                
                setTimeout(() => {
                    createConfetti();
                    setTimeout(createContinuousConfetti, 500);
                }, 500);
            }
        });
    </script>
</body>
</html>
