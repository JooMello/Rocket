<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário Ellen 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FFE8F5 0%, #FFF5F7 50%, #FFE8F5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Partículas flutuantes */
        .particle {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        /* Container principal */
        .container {
            max-width: 800px;
            width: 90%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: 0 30px 80px rgba(255, 105, 180, 0.25);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cabeçalho */
        .header {
            margin-bottom: 40px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FF1493 0%, #FF69B4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            animation: fadeIn 0.8s ease-out 0.3s backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: #FF1493;
            margin: 30px 0;
            animation: fadeIn 0.8s ease-out 0.5s backwards;
        }

        /* Decoração */
        .decoration {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            font-size: 2rem;
            animation: fadeIn 0.8s ease-out 0.7s backwards;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFB6C1, transparent);
        }

        /* Mensagem */
        .message {
            font-size: 1.2rem;
            color: #666;
            line-height: 2;
            margin: 40px 0;
            animation: fadeIn 0.8s ease-out 0.9s backwards;
        }

        .message strong {
            color: #FF1493;
            font-weight: 600;
        }

        /* Ícones */
        .icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 40px 0;
            font-size: 2.5rem;
        }

        .icon {
            animation: popIn 0.5s ease-out backwards;
        }

        .icon:nth-child(1) { animation-delay: 1.1s; }
        .icon:nth-child(2) { animation-delay: 1.2s; }
        .icon:nth-child(3) { animation-delay: 1.3s; }
        .icon:nth-child(4) { animation-delay: 1.4s; }
        .icon:nth-child(5) { animation-delay: 1.5s; }
        .icon:nth-child(6) { animation-delay: 1.6s; }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Coração animado */
        .heart-big {
            font-size: 4rem;
            margin: 30px 0;
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite, fadeIn 0.8s ease-out 1.7s backwards;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            10%, 30% {
                transform: scale(1.1);
            }
            20%, 40% {
                transform: scale(1);
            }
        }

        /* Assinatura */
        .signature {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: #FF1493;
            font-style: italic;
            margin-top: 40px;
            animation: fadeIn 0.8s ease-out 1.9s backwards;
        }

        /* Confetes */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
                width: 95%;
            }
            .title {
                font-size: 2.5rem;
            }
            .name {
                font-size: 3rem;
            }
            .message {
                font-size: 1.05rem;
                line-height: 1.8;
            }
            .icons {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Partículas de fundo -->
    <div class="particle" style="left: 5%; top: 10%; animation-delay: 0s;">🌸</div>
    <div class="particle" style="right: 10%; top: 20%; animation-delay: 1s;">💕</div>
    <div class="particle" style="left: 15%; bottom: 15%; animation-delay: 2s;">🎀</div>
    <div class="particle" style="right: 8%; bottom: 25%; animation-delay: 1.5s;">✨</div>
    <div class="particle" style="left: 50%; top: 5%; animation-delay: 0.5s;">🌺</div>
    <div class="particle" style="right: 20%; top: 60%; animation-delay: 2.5s;">💖</div>

    <!-- Container principal -->
    <div class="container">
        <div class="header">
            <div class="title">Feliz Aniversário</div>
            <div class="name">Ellen</div>
        </div>

        <div class="decoration">
            <div class="divider"></div>
            <span>🌸</span>
            <div class="divider"></div>
        </div>

        <div class="message">
            <strong>Feliz aniversário, meu amor!</strong><br><br>
            Hoje é um dia especial para celebrar<br>
            a pessoa incrível que você é!<br><br>
            Que esse novo ano da sua vida seja repleto<br>
            de alegrias, conquistas e momentos inesquecíveis.<br><br>
            <strong>Te amo muito! 💕</strong>
        </div>

        <div class="icons">
            <span class="icon">🎂</span>
            <span class="icon">🎁</span>
            <span class="icon">🎈</span>
            <span class="icon">🎉</span>
            <span class="icon">🌸</span>
            <span class="icon">💕</span>
        </div>

        <div class="heart-big">💖</div>

        <div class="signature">
            Com todo amor ✨
        </div>
    </div>

    <script>
        // Criar confetes
        const colors = ['#FF1493', '#FF69B4', '#FFB6C1', '#FFC0CB', '#FFD700'];
        
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-20px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `confetti-fall ${2 + Math.random() * 2}s linear forwards`;
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }
        }

        // Lançar confetes após animações iniciais
        setTimeout(createConfetti, 2000);

        // Confetes contínuos
        setInterval(() => {
            for (let i = 0; i < 3; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-20px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confetti-fall ${2 + Math.random() * 2}s linear forwards`;
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 4000);
            }
        }, 800);
    </script>
</body>
</html>
