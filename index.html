<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversário Ellen 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFE5E5 0%, #FFF0F5 50%, #FFEEF8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Nuvenzinhas fofas de fundo */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            opacity: 0.6;
        }

        /* Card principal */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(255, 182, 193, 0.3);
            text-align: center;
            max-width: 500px;
            margin: 20px;
            position: relative;
            z-index: 10;
            border: 3px solid #FFB6C1;
        }

        /* Gatinhos decorativos nos cantos */
        .corner-cat {
            position: absolute;
            font-size: 2rem;
            animation: gentle-bounce 3s ease-in-out infinite;
        }

        .corner-cat.top-left {
            top: -15px;
            left: -15px;
        }

        .corner-cat.top-right {
            top: -15px;
            right: -15px;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Título */
        .title {
            font-size: 2rem;
            font-weight: 600;
            color: #FF69B4;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* Nome da aniversariante */
        .name {
            font-size: 3.5rem;
            font-weight: 700;
            color: #FF1493;
            margin: 20px 0;
            text-shadow: 2px 2px 0 rgba(255, 182, 193, 0.3);
        }

        /* Linha de gatinhos e flores */
        .decoration-line {
            font-size: 1.8rem;
            margin: 25px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        /* Mensagem */
        .message {
            font-size: 1.1rem;
            color: #DB7093;
            line-height: 1.8;
            margin: 25px 0;
            font-weight: 500;
        }

        /* Coraçãozinho final */
        .heart-bottom {
            font-size: 2rem;
            margin-top: 20px;
            animation: pulse-heart 1.5s ease-in-out infinite;
        }

        @keyframes pulse-heart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Flores flutuantes */
        .floating-flower {
            position: absolute;
            font-size: 1.5rem;
            animation: float-gentle 4s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes float-gentle {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Gatinhos flutuantes fofos */
        .floating-cat {
            position: absolute;
            font-size: 2rem;
            animation: float-gentle 5s ease-in-out infinite;
            opacity: 0.7;
        }

        /* Pétalas caindo delicadamente */
        .petal {
            position: absolute;
            font-size: 1.2rem;
            animation: fall-soft linear infinite;
            opacity: 0.7;
        }

        @keyframes fall-soft {
            to {
                transform: translateY(100vh) rotate(180deg);
                opacity: 0;
            }
        }

        /* Corações sutis */
        .heart-float {
            position: absolute;
            color: #FFB6C1;
            animation: rise-gentle 8s ease-in-out infinite;
        }

        @keyframes rise-gentle {
            0% {
                bottom: -30px;
                opacity: 0.8;
            }
            100% {
                bottom: 110%;
                opacity: 0;
            }
        }

        /* Laçinho decorativo */
        .bow {
            font-size: 2.5rem;
            margin: 15px 0;
            display: inline-block;
            animation: gentle-swing 2s ease-in-out infinite;
        }

        @keyframes gentle-swing {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        @media (max-width: 768px) {
            .card {
                padding: 40px 30px;
                margin: 15px;
            }
            .title { font-size: 1.6rem; }
            .name { font-size: 2.8rem; }
            .message { font-size: 1rem; }
            .decoration-line { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Nuvenzinhas de fundo -->
    <div class="cloud" style="width: 100px; height: 50px; top: 10%; left: 5%;"></div>
    <div class="cloud" style="width: 120px; height: 60px; top: 20%; right: 10%;"></div>
    <div class="cloud" style="width: 90px; height: 45px; bottom: 15%; left: 8%;"></div>
    <div class="cloud" style="width: 110px; height: 55px; bottom: 25%; right: 5%;"></div>

    <!-- Card principal -->
    <div class="card">
        <!-- Gatinhos nos cantos -->
        <div class="corner-cat top-left">🐱</div>
        <div class="corner-cat top-right">🐱</div>

        <div class="title">Feliz Aniversário</div>
        
        <div class="bow">🎀</div>
        
        <div class="name">Ellen</div>
        
        <div class="decoration-line">
            <span>🌸</span>
            <span>🐱</span>
            <span>💕</span>
            <span>🐱</span>
            <span>🌸</span>
        </div>
        
        <div class="message">
            Que seu dia seja repleto de amor,<br>
            sorrisos e momentos especiais!<br>
            Você merece tudo de mais lindo<br>
            nesse mundo! ✨
        </div>
        
        <div class="heart-bottom">💖</div>
    </div>

    <!-- Gatinhos flutuantes -->
    <div class="floating-cat" style="left: 8%; top: 15%; animation-delay: 0s;">🐱</div>
    <div class="floating-cat" style="right: 12%; top: 25%; animation-delay: 1.5s;">😺</div>
    <div class="floating-cat" style="left: 10%; bottom: 20%; animation-delay: 2s;">😸</div>
    <div class="floating-cat" style="right: 8%; bottom: 30%; animation-delay: 0.8s;">😻</div>

    <!-- Flores flutuantes -->
    <div class="floating-flower" style="left: 15%; top: 30%; animation-delay: 0s;">🌸</div>
    <div class="floating-flower" style="right: 18%; top: 40%; animation-delay: 1s;">🌺</div>
    <div class="floating-flower" style="left: 20%; bottom: 35%; animation-delay: 1.5s;">🌷</div>
    <div class="floating-flower" style="right: 15%; bottom: 25%; animation-delay: 0.5s;">🌼</div>
    <div class="floating-flower" style="left: 12%; top: 50%; animation-delay: 2s;">🌹</div>
    <div class="floating-flower" style="right: 10%; top: 60%; animation-delay: 2.5s;">🌸</div>

    <script>
        // Criar pétalas caindo delicadamente
        const petals = ['🌸', '🌺', '🌷', '🌼'];
        for (let i = 0; i < 15; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.textContent = petals[Math.floor(Math.random() * petals.length)];
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDuration = (Math.random() * 4 + 6) + 's';
            petal.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(petal);
        }

        // Criar coraçõezinhos subindo
        for (let i = 0; i < 8; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.textContent = '💕';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 1 + 1) + 'rem';
            heart.style.animationDelay = Math.random() * 8 + 's';
            heart.style.animationDuration = (Math.random() * 3 + 7) + 's';
            document.body.appendChild(heart);
        }
    </script>
</body>
</html>
